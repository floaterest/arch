name: Build AUR Packages

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      darkly: { type: boolean, default: true }
      betterbird-bin: { type: boolean, default: true }
      wechat-bin: { type: boolean, default: true }
      yay-bin: { type: boolean, default: true }
      zed-preview-bin: { type: boolean, default: true }
      zen-browser-bin: { type: boolean, default: true }
      zoom: { type: boolean, default: true }
      zotero-bin: { type: boolean, default: true }
      qt6ct-kde: { type: boolean, default: true }
      fcitx5-mozc-ut: { type: boolean, default: true, description: mozc-ut fcitx5-mozc-ut }
      opentabletdriver: { type: boolean, default: true }
      claude-desktop: { type: boolean, default: true }
      paru: { type: boolean, default: true }
      freedownloadmanager: { type: boolean, default: true }

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - run: pacman -Syu --noconfirm git base-devel sudo fcitx5 go-yq

      - name: Create a non-root user
        run: |
          useradd -m u
          echo "u ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/u
          chown -R u:u .

      # on push, inputs is empty so every package is built
      - name: Build selected packages
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          PACKAGES=$(yq '.on.workflow_dispatch.inputs | to_entries | .[] | select(env(INPUTS)[.key] != false) | .value.description // .key' .github/workflows/aur.yml)
          sudo -u u bash -c "./makepkg.sh `tac <<< $PACKAGES | xargs`"

      - run: |
          find -name '*-debug-*.pkg.tar.zst' -exec rm {} \;
          mkdir -p packages
          find -name '*.pkg.tar.zst' -exec mv {} packages \;
          echo 'Run `sudo pacman -U *.zst` to install.' >> $GITHUB_STEP_SUMMARY
          ls packages | sed 's/^/- /g' >> $GITHUB_STEP_SUMMARY

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages
  clear:
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
    - name: Delete past workflow runs
      run: |
        gh api /repos/${{ github.repository }}/actions/runs -q '.workflow_runs[] | .id' \
        | tail -n +2 \
        | xargs -P0 -tI{} gh api -X DELETE /repos/${{ github.repository }}/actions/runs/{}
      env:
        GH_TOKEN: ${{ github.token }}
